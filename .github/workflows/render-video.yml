name: Render short film

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out project
        uses: actions/checkout@v4
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Render MP4
        run: python scripts/render_video.py
      - name: Upload finished video
        uses: actions/upload-artifact@v4
        with:
          name: the-world-through-my-eyes-video
          path: output/the-world-through-my-eyes.mp4
          if-no-files-found: error
          retention-days: 14
